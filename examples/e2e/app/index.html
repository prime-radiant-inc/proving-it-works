<!doctype html><meta charset="utf-8"><title>Counter</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;
font:600 22px/1.4 -apple-system,Helvetica,sans-serif;background:#faf8f4;color:#23211d}
#n{font-size:140px;line-height:1;color:#b3422f}
button{margin-top:24px;padding:12px 28px;font:inherit;border:0;border-radius:8px;
background:#b3422f;color:#fff;cursor:pointer}</style>
<div style="text-align:center"><div id="n">0</div>
<button id="b">count it</button></div>
<script>let c=0;b.onclick=()=>{n.textContent=++c}</script>
